<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable | Nathan Trading</title>
    <link rel="icon" type="image/png" href="assets/image2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FGL81C37G2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FGL81C37G2');
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .logo {
            width: 80px;
            margin-bottom: 30px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, #00c8ff, #00ffae);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
        }

        p {
            font-size: 16px;
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 16px 32px;
            background: #00c8ff;
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,200,255,0.3);
        }

        .btn-secondary {
            padding: 16px 32px;
            background: transparent;
            color: #00c8ff;
            border: 2px solid #00c8ff;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: rgba(0,200,255,0.1);
            transform: translateY(-3px);
        }

        .icon-404 {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }

        @media (max-width: 480px) {
            .error-code { font-size: 80px; }
            h1 { font-size: 22px; }
            .buttons { flex-direction: column; align-items: center; }
            .btn-primary, .btn-secondary { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="assets/image2.png" class="logo" alt="Nathan Trading">
        <span class="icon-404">🔍</span>
        <div class="error-code">404</div>
        <h1>Page introuvable</h1>
        <p>
            Oups ! La page que vous cherchez n'existe pas ou a été déplacée.<br>
            Retournez à l'accueil ou connectez-vous à votre espace élève.
        </p>
        <div class="buttons">
            <a href="index.html" class="btn-primary">
                <i class="fa-solid fa-house"></i> Retour à l'accueil
            </a>
            <a href="connexion.html" class="btn-secondary">
                <i class="fa-solid fa-right-to-bracket"></i> Se connecter
            </a>
        </div>
    </div>

</body>
</html>
