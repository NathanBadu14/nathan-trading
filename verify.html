    <link rel="icon" type="image/png" href="/assets/image2.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/site.css">

    <!-- Google tag (gtag.js) -->

<body>

    <header class="nav">
        <div class="container nav-inner">
            <a href="/index.html" class="brand">
                <img src="/assets/image2.png" alt="Logo Nathan Trading">
                <span>NATHAN TRADING</span>
            </a>
            <div class="nav-actions">
                <a href="/index.html" class="btn btn-ghost" style="display:inline-flex;"><i class="fa-solid fa-arrow-left"></i> Accueil</a>
            </div>
        </div>
    </header>

    <main class="center-page" style="align-items:flex-start;padding-top:70px;">
        <div class="center-card" style="text-align:center;">
            <h1>Vérifier un certificat</h1>
            <p>Saisis l'identifiant inscrit sur le certificat (exemple : NTA-2026-1A2B3C4D).</p>
            <form class="verify-box" id="verify-form">
                <div class="field">
                    <label for="cert-id">Identifiant du certificat</label>
                    <input class="input" id="cert-id" type="text" placeholder="NTA-2026-XXXXXXXX" maxlength="30" autocomplete="off" required>
                </div>
                <button class="btn btn-primary btn-block" type="submit">Vérifier</button>
                <div class="verify-result" id="verify-result" role="status"></div>
            </form>
        </div>
    </main>

    <footer class="simple-footer">
        <div class="container">
            <a href="/mentions-legales.html">Mentions légales</a>
