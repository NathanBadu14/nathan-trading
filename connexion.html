<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Nathan Trading</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/image2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-container">

        <img src="assets/image2.png" class="auth-logo" alt="Nathan Trading Logo">

        <h1>Connexion</h1>
        <p>Accédez à votre espace élève</p>

        <form id="login-form">
            <input 
                type="email" 
                id="login-email" 
                placeholder="Adresse email" 
                autocomplete="email"
                required
            >

            <div class="password-box">
                <input
                    type="password"
                    id="login-password"
                    placeholder="Mot de passe"
                    required
                >
                <i class="fa-solid fa-eye" id="toggle-login-password"></i>
            </div>

            <p class="forgot-password">
                <a href="#" id="reset-password">Mot de passe oublié ?</a>
            </p>

            <button type="submit" class="primary-btn">
                Se connecter
            </button>
            
            <div class="auth-divider">
                <span>ou</span>
            </div>

            <button type="button" id="google-login" class="google-btn">
                <i class="fa-brands fa-google"></i> Continuer avec Google
            </button>
        </form>

        <p class="auth-switch">
            Pas encore inscrit ?
            <a href="inscription.html">Créer un compte</a>
        </p>

    </div>

    <script type="module" src="login.js"></script>

</body>
</html>
