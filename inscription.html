<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Nathan Trading Academy</title>
    <meta name="description" content="Créez votre compte Nathan Trading Academy et commencez votre formation en trading Forex, indices et crypto en français.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#05080b">
    <link rel="canonical" href="https://nathan-trading.com/inscription.html">
    <link rel="icon" href="assets/image2.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="site.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FGL81C37G2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-FGL81C37G2');
    </script>
</head>

<body>
    <main class="auth-page">
        <div class="auth-card">
            <a href="index.html" aria-label="Retour à l'accueil"><img src="assets/image2.png" class="auth-logo" alt="Logo Nathan Trading"></a>
            <h1>Créer un compte</h1>
            <p class="auth-sub">Rejoins Nathan Trading Academy</p>

            <form class="form" id="register-form">
                <div class="field">
                    <label for="register-name">Prénom</label>
                    <input class="input" type="text" id="register-name" placeholder="Ton prénom" autocomplete="given-name" maxlength="60" required>
                </div>

                <div class="field">
                    <label for="register-email">Adresse email</label>
                    <input class="input" type="email" id="register-email" placeholder="ton@email.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="register-password">Mot de passe</label>
                    <div class="pw-box">
                        <input class="input" type="password" id="register-password" placeholder="6 caractères minimum" autocomplete="new-password" minlength="6" required>
                        <i class="fa-solid fa-eye" id="toggle-register-password" role="button" aria-label="Afficher le mot de passe"></i>
                    </div>
                    <span class="form-hint" id="pw-strength" aria-live="polite"></span>
                </div>

                <div class="field">
                    <label for="register-password-confirm">Confirmer le mot de passe</label>
                    <div class="pw-box">
                        <input class="input" type="password" id="register-password-confirm" placeholder="Répète le mot de passe" autocomplete="new-password" required>
                        <i class="fa-solid fa-eye" id="toggle-register-password-confirm" role="button" aria-label="Afficher le mot de passe"></i>
                    </div>
                </div>

                <div class="form-msg" id="auth-msg" role="status" aria-live="polite"></div>

                <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>

                <div class="auth-divider">ou</div>

                <button type="button" id="google-register" class="btn google-btn btn-block">
                    <i class="fa-brands fa-google"></i> S'inscrire avec Google
                </button>

                <p class="form-hint" style="text-align:center;">En créant un compte, tu acceptes les <a href="conditions-utilisation.html" target="_blank" rel="noopener" style="color:var(--cyan);">conditions d'utilisation</a>.</p>
            </form>

            <p class="auth-switch">Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
        </div>
    </main>

    <script type="module" src="register.js"></script>
</body>

</html>
